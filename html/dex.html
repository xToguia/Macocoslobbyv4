<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>???</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow-y: auto;
  }
  .wrap {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 40px 16px;
    box-sizing: border-box;
  }
  .wrap img {
    max-width: 480px;
    width: 90vw;
    height: auto;
    display: block;
    box-shadow: 0 0 40px rgba(255,255,255,0.05);
    opacity: 0;
    animation: fadein 1.6s ease forwards;
  }
  .wrap img:nth-of-type(2) {
    animation-delay: 1.4s;
  }
  @keyframes fadein {
    from { opacity: 0; transform: scale(0.98); }
    to   { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>
  <div class="wrap">
    <img src="background.png" alt="">
    <br>
    <br>
    <br>
    <img src="background2.png" alt="">
  </div>
</body>
</html>
